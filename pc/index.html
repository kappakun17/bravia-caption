<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>BRAVIA Caption — PC検証</title>
<style>body{background:#101820;color:#fff;font:18px system-ui;max-width:900px;margin:40px auto;padding:24px}button,input{font:inherit;padding:12px;margin:8px}button{cursor:pointer}#caption{min-height:150px;background:#000;border-radius:16px;font-size:36px;padding:28px;white-space:pre-wrap}#status{color:#b8d8ed}small{color:#b8d8ed}pre{white-space:pre-wrap}</style>
<h1>日本語字幕 · PC検証</h1><p>音声ファイルまたはマイクを使って、字幕の更新を確認します。</p>
<input id="file" type="file" accept="audio/*"><button id="play">音声ファイルを開始</button><button id="mic">マイクを開始</button><button id="stop" disabled>停止</button>
<p id="status">待機中</p><div id="caption" aria-live="polite">ここに字幕が表示されます</div>
<p><small>処理はこのPC内で行います。最初の字幕までの時間には音声冒頭の無音も含まれます。テレビの遅延を示す数値ではありません。</small></p><pre id="metric"></pre>
<script>
let ws,ctx,media,processor,source,started,first,partial='',finals=[],running=false,stopRequested=false;
const $=id=>document.getElementById(id);
function state(on){running=on;$('play').disabled=on;$('mic').disabled=on;$('stop').disabled=!on}
async function cleanup(){state(false);source?.disconnect();processor?.disconnect();media?.getTracks().forEach(t=>t.stop());if(ctx&&ctx.state!=='closed')await ctx.close();media=processor=source=null}
function connect(rate){return new Promise((resolve,reject)=>{ws=new WebSocket('ws://127.0.0.1:8080/v1/audio/transcriptions/realtime');let ready=false;const timer=setTimeout(()=>{reject(Error('認識サーバーの応答待ちがタイムアウトしました'));ws.close()},15000);ws.onopen=()=>ws.send(JSON.stringify({type:'session.update',session:{sample_rate:rate,language:'ja-JP'}}));ws.onerror=()=>reject(Error('認識サーバーに接続できません'));ws.onclose=()=>{clearTimeout(timer);if(!ready)reject(Error('接続が閉じました'));cleanup()};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='session.updated'){ready=true;clearTimeout(timer);resolve()}else if(m.type.endsWith('.delta')||m.type.endsWith('.completed')){if(first===undefined){first=performance.now()-started;$('metric').textContent='最初の字幕まで '+Math.round(first)+' ms（入力開始から）'}if(m.type.endsWith('.delta'))partial+=m.delta||'';else{finals.push(m.transcript||'');partial=''}$('caption').textContent=[...finals.slice(-2),partial].filter(Boolean).join('\n')}else if(m.type==='input_audio_buffer.committed'){ws.close();$('status').textContent='完了'}else if(m.type==='error'){ $('status').textContent=m.error?.message||'認識エラー';ws.close()}}})}
function pcm(f){const p=new Int16Array(f.length);for(let i=0;i<f.length;i++)p[i]=Math.round(Math.max(-1,Math.min(1,f[i]))*32767);return p}
function begin(){stopRequested=false;first=undefined;partial='';finals=[];$('caption').textContent='認識待ち…';$('metric').textContent='';state(true)}
$('play').onclick=async()=>{try{if(!$('file').files[0])throw Error('音声ファイルを選んでください');begin();ctx=new AudioContext({sampleRate:16000});const buffer=await ctx.decodeAudioData(await $('file').files[0].arrayBuffer());await connect(buffer.sampleRate);started=performance.now();$('status').textContent='音声ファイルを実時間で入力中';const n=buffer.length,mono=new Float32Array(n);for(let c=0;c<buffer.numberOfChannels;c++){const f=buffer.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=f[i]/buffer.numberOfChannels}source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);source.start();const step=Math.round(buffer.sampleRate*.16);for(let i=0;i<n&&!stopRequested;i+=step){await new Promise(r=>setTimeout(r,Math.max(0,started+i/buffer.sampleRate*1000-performance.now())));if(!stopRequested&&ws.readyState===1)ws.send(pcm(mono.subarray(i,i+step)).buffer)}if(!stopRequested){await new Promise(r=>setTimeout(r,Math.max(0,started+buffer.duration*1000-performance.now())));if(ws.readyState===1)ws.send(JSON.stringify({type:'input_audio_buffer.commit'}))}}catch(e){$('status').textContent=e.message;ws?.close();await cleanup()}};
$('mic').onclick=async()=>{try{begin();media=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1},video:false});ctx=new AudioContext();await connect(ctx.sampleRate);started=performance.now();source=ctx.createMediaStreamSource(media);processor=ctx.createScriptProcessor(4096,1,1);processor.onaudioprocess=e=>{if(ws.readyState===1&&!stopRequested)ws.send(pcm(e.inputBuffer.getChannelData(0)).buffer)};source.connect(processor);processor.connect(ctx.destination);$('status').textContent='マイク入力中'}catch(e){$('status').textContent=e.message;ws?.close();await cleanup()}};
$('stop').onclick=()=>{stopRequested=true;if(source?.stop)try{source.stop()}catch{}processor?.disconnect();media?.getTracks().forEach(t=>t.stop());if(ws?.readyState===1)ws.send(JSON.stringify({type:'input_audio_buffer.commit'}));$('status').textContent='終了処理中'};
</script></html>
